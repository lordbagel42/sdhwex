<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permanent rejection popup fixture</title>
<style>
:root{color-scheme:dark;--color-space-text:#eef0f8;--color-space-text-muted:#b5bed0;--color-space-border:#535c70;--color-set-1-bg:#202437;--space-s:12px;--space-m:20px;--space-xl:28px}*{box-sizing:border-box}body{margin:0;padding:28px;background:#121625;color:var(--color-space-text);font:14px/1.5 system-ui,sans-serif}.fixture{color:var(--color-space-text-muted)}button,textarea{font:inherit}.action-btn{border:1px solid #697389;border-radius:8px;padding:8px 12px;background:#202437;color:inherit;cursor:pointer}.action-btn:hover{background:#363048}.action-btn:focus-visible,textarea:focus-visible{outline:2px solid #ebb7ff;outline-offset:2px}.action-btn--destructive{background:#642f3c;border-color:#e9a19f}.hardware-review__fraud-modal{position:fixed;inset:0;margin:auto;width:min(460px,calc(100vw - 48px));max-height:calc(100vh - 40px);padding:0;border:none;background:transparent;color:inherit}.hardware-review__fraud-modal::backdrop{background:rgba(8,6,30,.75);backdrop-filter:blur(4px)}.hardware-review__fraud-modal-card{position:relative;display:grid;gap:20px;padding:28px;background:#202437;border:1px solid #e9a19f;border-radius:12px}.hardware-review__fraud-modal-title{margin:0;padding-right:24px;font-size:18px}.hardware-review__fraud-modal-note{margin:0;color:var(--color-space-text-muted);line-height:1.4}.hardware-review__fraud-form{display:grid;gap:12px}.hardware-review__fraud-form-input{width:100%;padding:12px;color:inherit;background:#121625;border:1px solid #697389;border-radius:8px;resize:vertical}.hardware-review__fraud-form-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px}.hardware-review__fraud-modal-close{position:absolute;top:8px;right:8px;padding:4px 8px;border:0;background:none;color:inherit;font-size:20px;cursor:pointer}
</style></head><body>
<main class="hardware-review"><h1>Hardware review fixture</h1><p class="fixture">Local popup fixture based on Stardance’s permanent-rejection form. No real reviews or submissions.</p><section class="ship-review__details"></section>
<button type="button" class="action-btn" onclick="document.getElementById('hardware-permanent-rejection').showModal()">Permanently reject project</button>
<dialog id="hardware-permanent-rejection" class="hardware-review__fraud-modal" aria-labelledby="permanent-rejection-title">
<div class="hardware-review__fraud-modal-card"><button type="button" class="hardware-review__fraud-modal-close" aria-label="Close" onclick="this.closest('dialog').close()">×</button>
<h3 id="permanent-rejection-title" class="hardware-review__fraud-modal-title">Permanently reject project</h3>
<p id="permanent-rejection-reason-help" class="hardware-review__fraud-modal-note">This takes effect immediately and prevents future funding or certification. The builder will receive your justification.</p>
<form class="hardware-review__fraud-form" onsubmit="event.preventDefault();this.dataset.submitted='true'">
<label for="permanent-rejection-reason">Justification (required)</label>
<textarea name="reason" id="permanent-rejection-reason" class="hardware-review__fraud-form-input" rows="6" maxlength="10000" required aria-describedby="permanent-rejection-reason-help">Before. After.</textarea>
<div class="hardware-review__fraud-form-actions"><button type="button" class="action-btn action-btn--small action-btn--secondary" onclick="this.closest('dialog').close()">Cancel</button><button type="submit" class="action-btn action-btn--small action-btn--destructive">Permanently reject</button></div>
</form></div></dialog></main></body></html>
